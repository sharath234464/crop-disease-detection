<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI';
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                url("{{ url_for('static', filename='images/farm-bg.jpg') }}") no-repeat center/cover;
}

.card {
    backdrop-filter: blur(15px);
    background: rgba(0,0,0,0.6);
    padding:40px;
    border-radius:20px;
    width:300px;
    text-align:center;
    color:white;
}

input {
    width:100%;
    padding:12px;
    margin:12px 0;
    border:none;
    border-radius:8px;
}

button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

button:hover {
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="card">
    <h2>Plant Disease Detection</h2>

    <form method="POST">
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
